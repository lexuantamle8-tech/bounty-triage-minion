[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bounty-triage-minion"
version = "0.1.0"
description = "Repeatable, local-first GitHub Issue & PR Triage / Release Readiness Agent built on the OpenMinion 0.1 Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "BountyTriage Minion Contributors" }]
keywords = ["openminion", "cortensor", "agent", "triage", "release-readiness", "local-first"]
dependencies = [
  "openminion>=0.1.0",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
bounty-triage = "bounty_triage_minion.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
